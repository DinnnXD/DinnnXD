<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Bokep 3d</title>
<style>
  /* Reset and base */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: linear-gradient(135deg, #ff0000, #cc0000);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
  }
  .container {
    position: relative;
    width: 320px;
    height: 180px;
    box-shadow: 0 0 30px #ffaa00;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
  }
  iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #ffcc00;
    font-weight: 700;
    font-size: 1.3rem;
    text-shadow: 0 0 8px #ffee00;
    transition: background 1.5s ease;
  }
  .overlay.hide {
    background: transparent;
  }
  .rick {
    animation: rickwave 2s infinite ease-in-out alternate;
  }
  @keyframes rickwave {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
    100% { transform: rotate(-10deg); }
  }
  .banner {
    position: absolute;
    top: 10px;
    left: -100%;
    font-size: 1rem;
    font-weight: 900;
    color: #fff;
    background: #ff0000dd;
    padding: 10px 20px;
    transform: skew(-15deg);
    animation: bannerSlide 8s linear forwards;
    user-select: none;
    box-shadow: 0 0 10px #ff0000;
    pointer-events: none;
  }
  @keyframes bannerSlide {
    0%   { left: -100%; }
    20%  { left: 10%; }
    80%  { left: 10%; }
    100% { left: 110%; }
  }
  /* Pulse button */
  .play-button {
    margin-top: 15px;
    background: #ffcc00;
    border: none;
    border-radius: 12px;
    color: #770000;
    font-size: 1.1rem;
    font-weight: 900;
    padding: 10px 22px;
    box-shadow: 0 0 15px #ffaa00;
    cursor: pointer;
    user-select: none;
    transition: transform 0.3s ease;
  }
  .play-button:hover {
    transform: scale(1.1);
  }
</style>
</head>
<body>
  <div class="container" tabindex="0" aria-label="Rick Roll Video Player">
    <iframe id="video" src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=0&mute=0&rel=0" allow="autoplay; encrypted-media" allowfullscreen title="Rick Astley - Never Gonna Give You Up"></iframe>
    <div class="overlay" id="overlay">
      <div class="rick">🎶 Never gonna give you up... 🎶</div>
      <button class="play-button" id="playBtn" aria-label="Play Rick Roll Video">Play Video</button>
    </div>
    <div class="banner" aria-hidden="true">🎵 Get Rick Rolled! 🎵</div>
  </div>

<script>
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const iframe = document.getElementById('video');
  let playing = false;

  playBtn.addEventListener('click', () => {
    if (playing) return;
    playing = true;
    overlay.classList.add('hide');
    // Enable autoplay with sound
    iframe.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0&rel=0";
  });

  // Also allow pressing Enter or Space on container to start
  document.querySelector('.container').addEventListener('keydown', (e) => {
    if (playing) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      playBtn.click();
    }
  });
</script>
</body>
</html>
